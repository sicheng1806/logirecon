[package]
name = "logirecon"
description = "物流对账分析工具，支持Excel数据导入、自动核对和报表生成"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
logirecon_gui = {workspace = true, optional = true}

calamine.workspace = true
chrono.workspace = true
log.workspace = true
polars.workspace = true
serde.workspace = true
thiserror.workspace = true
rust_xlsxwriter = {workspace = true, optional = true}

[dev-dependencies]
polars_excel_writer.workspace = true

[features]
default = []
excel_write = ["rust_xlsxwriter"]
gui = ["logirecon_gui"]


[workspace]
resolver = "2"
members = [
    "gui"
]


[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["sicheng<sicheng1806@outlook.com>"]

[workspace.dependencies]
logirecon_gui = {version = "0.1.0", path = "gui"}

calamine = { version = "0.35.0", features = ["chrono"] }
chrono = { version = "0.4.41", features = ["std"] }
env_logger = "0.11.10"
log = "0.4.30"
polars = { version = "0.53.0", features = [
    "lazy",
    "round_series",
    "strings",
    "dtype-struct",
    "regex",
    "concat_str",
    "dtype-categorical","dtype-u8","abs", "csv"
] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
polars_excel_writer = "0.25.0"
rust_xlsxwriter = "0.95.0"
iced = {version = "0.14.0", features = ["canvas", "svg"]}
uuid = {version = "1.23.3", features = ["v4", "fast-rng", "serde"]}
